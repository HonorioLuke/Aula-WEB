<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Mini Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="app-header" class="hidden">
        <div class="logo">🎮 MiniGames Hub</div>
        <div class="user-info">Olá, <span id="display-username">Visitante</span></div>
    </header>

    <main>
        <section id="tela-login" class="container">
            <h2>Bem-vindo!</h2>
            <p>Faça seu cadastro para acessar os jogos.</p>
            <form id="form-login">
                <input type="text" id="nome-completo" placeholder="Nome Completo" required>
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="text" id="username" placeholder="Nome de Usuário (Apelido)" required>
                <button type="submit" class="btn-primary">Entrar no Sistema</button>
            </form>
        </section>

        <section id="tela-menu" class="container hidden">
            <h2>Escolha seu App</h2>
            <div class="grid-apps">
                <div class="card-app" onclick="navegarPara('tela-velha')">
                    <div class="icone">❌⭕</div>
                    <h3>Jogo da Velha</h3>
                </div>
                <div class="card-app" onclick="navegarPara('tela-calculadora')">
                    <div class="icone">🧮</div>
                    <h3>Calculadora</h3>
                </div>
                <div class="card-app" onclick="navegarPara('tela-adivinhacao')">
                    <div class="icone">❓</div>
                    <h3>Adivinhe o Número</h3>
                </div>
            </div>
        </section>

        <section id="tela-velha" class="container hidden">
            <button class="btn-voltar" onclick="navegarPara('tela-menu')">⬅ Voltar</button>
            <h2>Jogo da Velha</h2>
            <div class="tabuleiro" id="tabuleiro-velha">
                <div class="celula" data-index="0"></div>
                <div class="celula" data-index="1"></div>
                <div class="celula" data-index="2"></div>
                <div class="celula" data-index="3"></div>
                <div class="celula" data-index="4"></div>
                <div class="celula" data-index="5"></div>
                <div class="celula" data-index="6"></div>
                <div class="celula" data-index="7"></div>
                <div class="celula" data-index="8"></div>
            </div>
            <p id="status-velha">Vez do Jogador: X</p>
            <button onclick="reiniciarVelha()">Reiniciar Jogo</button>
        </section>

        <section id="tela-calculadora" class="container hidden">
            <button class="btn-voltar" onclick="navegarPara('tela-menu')">⬅ Voltar</button>
            <h2>Calculadora</h2>
            <div class="calculadora">
                <input type="text" id="display-calc" readonly>
                <div class="botoes-calc">
                    <button onclick="addCalc('7')">7</button>
                    <button onclick="addCalc('8')">8</button>
                    <button onclick="addCalc('9')">9</button>
                    <button onclick="addCalc('/')" class="op">÷</button>
                    <button onclick="addCalc('4')">4</button>
                    <button onclick="addCalc('5')">5</button>
                    <button onclick="addCalc('6')">6</button>
                    <button onclick="addCalc('*')" class="op">×</button>
                    <button onclick="addCalc('1')">1</button>
                    <button onclick="addCalc('2')">2</button>
                    <button onclick="addCalc('3')">3</button>
                    <button onclick="addCalc('-')" class="op">-</button>
                    <button onclick="limparCalc()" class="limpar">C</button>
                    <button onclick="addCalc('0')">0</button>
                    <button onclick="calcularResultado()" class="igual">=</button>
                    <button onclick="addCalc('+')" class="op">+</button>
                </div>
            </div>
        </section>

        <section id="tela-adivinhacao" class="container hidden">
            <button class="btn-voltar" onclick="navegarPara('tela-menu')">⬅ Voltar</button>
            <h2>Adivinhe o Número</h2>
            <p>Estou pensando em um número entre 1 e 100.</p>
            
            <input type="number" id="chute" placeholder="Digite seu palpite">
            <button onclick="verificarChute()">Chutar</button>
            
            <div id="msg-adivinhacao" class="mensagem-resultado"></div>
            <button onclick="iniciarAdivinhacao()" style="margin-top: 10px;">Novo Jogo</button>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
